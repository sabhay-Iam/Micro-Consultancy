<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Consultancy - Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>MICRO CONSULTANCY</h1>
    <h2>Student Registration Form</h2>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>

        <label>Father's Name</label>
        <input type="text" id="father" placeholder="Enter Father's Name" required>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter Email" required>

        <label>Mobile Number</label>
        <input type="text" id="mobile" placeholder="Enter 10 Digit Mobile Number" maxlength="10" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter Address" rows="3" required></textarea>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create Password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit" class="btn">Register Now</button>

    </form>

    <p>Already Registered?</p>
    <a href="login.html">Go to Login</a>

</div>

<script src="js/register.js"></script>

</body>
</html>
