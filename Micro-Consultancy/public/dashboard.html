<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Consultancy - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>MICRO CONSULTANCY</h1>
    <h2>Student Dashboard</h2>

    <div class="profile-card">

        <h3>Welcome, <span id="userName">Student</span></h3>

        <p><strong>Father's Name :</strong> <span id="fatherName"></span></p>

        <p><strong>Email :</strong> <span id="email"></span></p>

        <p><strong>Mobile :</strong> <span id="mobile"></span></p>

        <p><strong>Date of Birth :</strong> <span id="dob"></span></p>

        <p><strong>Address :</strong> <span id="address"></span></p>

    </div>

    <br>

    <button id="logoutBtn" class="btn">Logout</button>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
